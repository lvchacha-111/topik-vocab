name: Daily Email

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Send daily email
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_RECEIVER: ${{ secrets.QQ_RECEIVER }}
          QQ_SMTP_CODE: ${{ secrets.QQ_SMTP_CODE }}
        run: python scripts/send_daily.py
