<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sam和Chase的韩语计划</title>
<link rel="stylesheet" href="style.css">
<style>
  .hero {
    text-align: center;
    padding: 48px 24px 40px;
  }
  .hero .eyebrow {
    margin-bottom: 14px;
  }
  .hero h1 {
    font-size: clamp(32px, 7vw, 48px);
    color: var(--plum);
    margin: 0;
  }
  .hero .sub {
    margin-top: 14px;
    color: var(--muted);
    font-size: 15px;
  }
  .ring-box {
    display: flex;
    justify-content: center;
    margin: 34px 0 8px;
  }
  .ring {
    position: relative;
    width: 150px;
    height: 150px;
  }
  .ring svg {
    transform: rotate(-90deg);
  }
  .ring .track {
    fill: none;
    stroke: var(--rose-100);
    stroke-width: 10;
  }
  .ring .bar {
    fill: none;
    stroke: url(#grad);
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 440;
    stroke-dashoffset: 304;
    transition: stroke-dashoffset 1s ease;
  }
  .ring .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .ring .center .num {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 700;
    color: var(--rose-600);
  }
  .ring .center .label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 26px;
  }
  .stats .item {
    text-align: center;
  }
  .stats .item .num {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 700;
    color: var(--plum);
  }
  .stats .item .label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .nav {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-top: 26px;
  }
  .nav a {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 22px 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow-sm);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .nav a:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
  }
  .nav .icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--rose-50);
    color: var(--rose-600);
  }
  .nav .title {
    font-size: 16px;
    font-weight: 700;
    color: var(--plum);
  }
  .nav .desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    margin-top: -4px;
  }
  .float-layer {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    overflow: hidden;
  }
  .float-msg {
    position: absolute;
    left: 0;
    white-space: nowrap;
    font-family: var(--serif);
    color: var(--rose-500);
    animation: drift linear infinite;
    will-change: transform;
  }
  .float-msg.chase { color: var(--berry); }
  @keyframes drift {
    from { transform: translateX(-40vw); }
    to { transform: translateX(105vw); }
  }
  .compose-fab {
    position: fixed;
    right: 20px;
    bottom: 22px;
    z-index: 30;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    background: var(--rose-500);
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(199,106,138,0.34);
    transition: transform .18s ease;
  }
  .compose-fab:hover { transform: translateY(-2px) scale(1.04); }
  .compose-panel {
    position: fixed;
    right: 20px;
    bottom: 88px;
    z-index: 30;
    width: 320px;
    max-width: calc(100vw - 40px);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    box-shadow: var(--shadow-lg);
    animation: panelIn .25s cubic-bezier(.2,.8,.2,1) both;
  }
  .who-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .who-btn {
    flex: 1;
    padding: 8px 0;
    border-radius: 999px;
    border: 1px solid var(--rose-200);
    background: var(--surface);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s ease;
  }
  .who-btn.active {
    background: var(--rose-500);
    border-color: var(--rose-500);
    color: #fff;
  }
  .compose-row {
    display: flex;
    gap: 10px;
  }
  .compose-row input {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    background: #fff;
    color: var(--ink);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .compose-row input:focus {
    border-color: var(--rose-300);
    box-shadow: 0 0 0 3px rgba(217,136,159,0.14);
  }
  .compose-row .btn {
    padding: 11px 18px;
    font-size: 14px;
  }
  @keyframes panelIn {
    from { opacity: 0; transform: translateY(10px) scale(.96); }
    to { opacity: 1; transform: none; }
  }
  @media (max-width: 560px) {
    .nav { grid-template-columns: 1fr; }
    .stats { gap: 22px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="spacer"></span>
  <span class="brand">Sam · Chase</span>
  <span class="spacer"></span>
</div>

<div class="wrap">
  <section class="hero">
    <div class="eyebrow">TOPIK 4级 · 一起学韩语</div>
    <h1 class="display">Sam · Chase 的韩语计划</h1>
    <div class="sub">从简单到难，每天一起积累，直到 2027 年 4 月</div>

    <div class="ring-box">
      <div class="ring">
        <svg width="150" height="150">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#d9889f"/>
              <stop offset="100%" stop-color="#c76a8a"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="75" cy="75" r="70"/>
          <circle class="bar" cx="75" cy="75" r="70"/>
        </svg>
        <div class="center">
          <div class="num">940</div>
          <div class="label">已学单词</div>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="item">
        <div class="num">940</div>
        <div class="label">已学单词</div>
      </div>
      <div class="item">
        <div class="num">47</div>
        <div class="label">打卡天数</div>
      </div>
      <div class="item">
        <div class="num">3,000</div>
        <div class="label">目标词汇</div>
      </div>
    </div>
  </section>

  <section class="nav">
    <a href="web.html">
      <div class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </div>
      <div class="title">今日单词</div>
      <div class="desc">按日期推进，从简单到难</div>
    </a>
    <a href="wordbank.html">
      <div class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <div class="title">单词库</div>
      <div class="desc">每日推送 + 延世词库</div>
    </a>
    <a href="phrasebank.html">
      <div class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z"/></svg>
      </div>
      <div class="title">想对他说的话</div>
      <div class="desc">每天一句韩语情话</div>
    </a>
    <a href="textbooks.html">
      <div class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </div>
      <div class="title">学习教材</div>
      <div class="desc">权威教材与官方备考资源</div>
    </a>
    <a href="hangeul.html">
      <div class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
      </div>
      <div class="title">韩语字母表</div>
      <div class="desc">한글 五十音 · 辅音与元音</div>
    </a>
  </section>

</div>

<div class="float-layer" id="floatLayer"></div>

<button class="compose-fab" id="composeFab" title="留言">✉</button>

<div class="compose-panel" id="composePanel" hidden>
  <div class="who-toggle">
    <button class="who-btn active" data-who="Sam">我是 Sam</button>
    <button class="who-btn" data-who="Chase">我是 Chase</button>
  </div>
  <div class="compose-row">
    <input id="msgInput" type="text" placeholder="写点想说的话…" maxlength="100">
    <button class="btn btn-primary" id="msgSend">发送</button>
  </div>
</div>

<script>
  const MSG_KEY = "coupleMessages";
  let currentUser = "Sam";

  function loadMessages() {
    try {
      return JSON.parse(localStorage.getItem(MSG_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveMessages(msgs) {
    localStorage.setItem(MSG_KEY, JSON.stringify(msgs));
  }

  function makeFloat(msg) {
    const el = document.createElement("div");
    el.className = "float-msg" + (msg.from === "Chase" ? " chase" : "");
    el.textContent = msg.text;
    const top = 8 + Math.random() * 72;
    const dur = 6 + Math.random() * 8;
    const delay = -Math.random() * dur;
    const size = 14 + Math.random() * 9;
    el.style.top = top + "vh";
    el.style.fontSize = size + "px";
    el.style.opacity = (0.45 + Math.random() * 0.35).toFixed(2);
    el.style.animationDuration = dur + "s";
    el.style.animationDelay = delay + "s";
    return el;
  }

  function renderFloats() {
    const layer = document.getElementById("floatLayer");
    layer.innerHTML = "";
    const msgs = loadMessages().slice(0, 12);
    msgs.forEach(m => layer.appendChild(makeFloat(m)));
  }

  function sendMessage() {
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if (!text) return;
    const msgs = loadMessages();
    const msg = { from: currentUser, text, time: Date.now() };
    msgs.unshift(msg);
    saveMessages(msgs);
    document.getElementById("floatLayer").appendChild(makeFloat(msg));
    input.value = "";
  }

  document.querySelectorAll(".who-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".who-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentUser = btn.dataset.who;
    });
  });

  document.getElementById("composeFab").addEventListener("click", () => {
    const panel = document.getElementById("composePanel");
    panel.hidden = !panel.hidden;
    if (!panel.hidden) document.getElementById("msgInput").focus();
  });

  document.getElementById("msgSend").addEventListener("click", sendMessage);
  document.getElementById("msgInput").addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });

  renderFloats();
</script>

</body>
</html>
