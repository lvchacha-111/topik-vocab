<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韩语字母表 · Sam和Chase的韩语计划</title>
<link rel="stylesheet" href="style.css">
<style>
  .page-head {
    padding: 26px 0 20px;
  }
  .page-head h1 {
    font-size: 30px;
    color: var(--plum);
    margin: 6px 0 4px;
  }
  .page-head .sub {
    color: var(--muted);
    font-size: 14px;
  }
  .group-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 700;
    color: var(--berry);
    margin: 28px 0 14px;
  }
  .group-title .count {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    color: var(--rose-600);
    background: var(--rose-50);
    padding: 3px 10px;
    border-radius: 999px;
  }
  .letter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 12px;
  }
  .letter-tile {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 8px 14px;
    text-align: center;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .letter-tile:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .letter-tile .char {
    font-family: var(--serif);
    font-size: 34px;
    font-weight: 700;
    color: var(--plum);
    line-height: 1.1;
  }
  .letter-tile .name {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  .letter-tile .roman {
    font-size: 13px;
    font-weight: 700;
    color: var(--rose-600);
    margin-top: 3px;
  }
  .syllable-note {
    margin-top: 28px;
    padding: 18px 20px;
    background: #fdf3e7;
    border: 1px solid #f2dfc2;
    border-radius: 14px;
    font-size: 13px;
    color: #8a6a3b;
    line-height: 1.8;
  }
  .syllable-note .example {
    font-size: 20px;
    color: var(--rose-600);
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">← 首页</a>
  <span class="brand">韩语字母表</span>
  <span class="spacer"></span>
</div>

<div class="wrap" style="max-width:720px;">
  <div class="page-head">
    <div class="eyebrow">HANGEUL</div>
    <h1 class="display">韩语字母表</h1>
    <div class="sub">한글 · 相当于日语的五十音图，点 🔊 听发音</div>
  </div>

  <div class="group-title">辅音 · 14 个 <span class="count">子音</span></div>
  <div class="letter-grid" id="consonants"></div>

  <div class="group-title">双辅音 · 5 个 <span class="count">紧音</span></div>
  <div class="letter-grid" id="doubleConsonants"></div>

  <div class="group-title">基本元音 · 10 个 <span class="count">母音</span></div>
  <div class="letter-grid" id="vowels"></div>

  <div class="group-title">复合元音 · 11 个 <span class="count">复合母音</span></div>
  <div class="letter-grid" id="compoundVowels"></div>

  <div class="syllable-note">
    <b>韩文拼写规则：</b>一个字 = 辅音 + 元音（+ 可选收音）。例如
    <span class="example">ㄱ + ㅏ = 가</span>，
    <span class="example">ㅎ + ㅏ + ㄴ = 한</span>。
    掌握了这些字母，所有韩语单词都能拼读出来。
  </div>
</div>

<script>
  const consonants = [
    ["ㄱ","기역","g/k"],["ㄴ","니은","n"],["ㄷ","디귿","d/t"],["ㄹ","리을","r/l"],
    ["ㅁ","미음","m"],["ㅂ","비읍","b/p"],["ㅅ","시옷","s"],["ㅇ","이응","ng"],
    ["ㅈ","지읒","j"],["ㅊ","치읓","ch"],["ㅋ","키읔","k"],["ㅌ","티읕","t"],
    ["ㅍ","피읖","p"],["ㅎ","히읗","h"]
  ];
  const doubleConsonants = [
    ["ㄲ","쌍기역","kk"],["ㄸ","쌍디귿","tt"],["ㅃ","쌍비읍","pp"],["ㅆ","쌍시옷","ss"],["ㅉ","쌍지읒","jj"]
  ];
  const vowels = [
    ["ㅏ","아","a"],["ㅑ","야","ya"],["ㅓ","어","eo"],["ㅕ","여","yeo"],["ㅗ","오","o"],
    ["ㅛ","요","yo"],["ㅜ","우","u"],["ㅠ","유","yu"],["ㅡ","으","eu"],["ㅣ","이","i"]
  ];
  const compoundVowels = [
    ["ㅐ","애","ae"],["ㅒ","얘","yae"],["ㅔ","에","e"],["ㅖ","예","ye"],["ㅘ","와","wa"],
    ["ㅙ","왜","wae"],["ㅚ","외","oe"],["ㅝ","워","wo"],["ㅞ","웨","we"],["ㅟ","위","wi"],["ㅢ","의","ui"]
  ];

  function ttsUrl(t) {
    return "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&q=" + encodeURIComponent(t) + "&tl=ko";
  }

  function tile([char, name, roman]) {
    return '<div class="letter-tile" data-audio="' + ttsUrl(name) + '" onclick="var a=new Audio(this.dataset.audio);a.play();">' +
      '<div class="char">' + char + '</div>' +
      '<div class="name">' + name + '</div>' +
      '<div class="roman">' + roman + '</div>' +
    '</div>';
  }

  document.getElementById("consonants").innerHTML = consonants.map(tile).join("");
  document.getElementById("doubleConsonants").innerHTML = doubleConsonants.map(tile).join("");
  document.getElementById("vowels").innerHTML = vowels.map(tile).join("");
  document.getElementById("compoundVowels").innerHTML = compoundVowels.map(tile).join("");
</script>
</body>
</html>
